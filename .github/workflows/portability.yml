name: Portability (no AVX)

# The portable x86-64 build on a CPU without AVX (QEMU's Nehalem model enforces the
# CPUID feature bits): the dispatcher must keep the SSE4.2 build and Whisper must run.
# The AVX2 build on the same emulated CPU is expected to crash, which shows the
# emulation really rejects AVX. Emulated inference is slow (its real run time is still
# unknown: the first two runs were cut off with no output), so this runs weekly, on
# release tags and on demand instead of on every push.
on:
  schedule:
    - cron: "17 3 * * 0"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-avx:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MODELS: -v akasha-models:/var/lib/akasha/models -e AKASHA_EMBED_MODEL=all-minilm-l6-v2 -e AKASHA_RERANK_MODEL=none -e AKASHA_WHISPER_MODEL=tiny
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: akasha:ci
          # Reuse ci.yml's layer cache (read only).
          cache-from: type=gha,scope=docker-amd64
      - name: Download models natively
        run: docker run --rm $MODELS akasha:ci models check
      - name: Portable build on an emulated CPU without AVX
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-user-static
          QEMU="-v /usr/bin/qemu-x86_64-static:/qemu:ro --entrypoint /qemu"
          # `timeout docker run` only kills the client: the container keeps running and
          # the step overran to the job's cap with no output (runs 1 and 2). Run detached,
          # stream the stage lines so a hang shows which model it got stuck on, and kill
          # the container ourselves when the bound is up.
          bounded() { # bounded <name> <bound> <binary>
            docker rm -f "$1" >/dev/null 2>&1 || true
            docker run -d --name "$1" $MODELS $QEMU akasha:ci -cpu Nehalem "$3" models check >/dev/null
            timeout "$2" docker logs -f "$1" 2>&1 | tee "$1.txt" || true
            if [ "$(docker inspect -f '{{.State.Running}}' "$1")" = true ]; then
              docker kill "$1" >/dev/null
              status=124
            else
              status=$(docker inspect -f '{{.State.ExitCode}}' "$1")
            fi
            docker rm -f "$1" >/dev/null 2>&1 || true
            return "$status"
          }
          if ! bounded portable 90m /usr/local/bin/akasha; then
            echo "::error::the portable build did not pass 'models check' within 90m on an"\
                 "emulated CPU without AVX; the stages above show how far it got"
            exit 1
          fi
          grep -q "cpu build baseline" portable.txt
          if bounded avx2 10m /usr/local/bin/akasha-avx2; then
            echo "::warning::the AVX2 build ran on an emulated CPU without AVX"
          fi
