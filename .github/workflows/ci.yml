name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: akasha
          POSTGRES_PASSWORD: akasha
          POSTGRES_DB: akasha
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U akasha" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://akasha:akasha@localhost:5432/akasha
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1 # reads rust-toolchain.toml
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli@0.8.6
      # sqlx macros check queries against this database, so it needs the schema first.
      - run: sqlx migrate run --source crates/db/migrations
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: .sqlx query cache is up to date
        run: cargo sqlx prepare --workspace --check -- --all-targets
      - name: openapi.json is up to date
        run: |
          cargo run -q -p akasha -- openapi | diff -u openapi.json - \
            || (echo "::error::openapi.json is stale: run 'just openapi'" && exit 1)

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: akasha:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image must really run inference: loads ONNX Runtime from the image and a
      # small model (~90 MB) from Hugging Face.
      - name: Smoke test (ONNX Runtime + embedding model)
        run: |
          docker run --rm -e AKASHA_EMBED_MODEL=all-minilm-l6-v2 -e AKASHA_RERANK_MODEL=none \
            akasha:ci models check
