name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: akasha
          POSTGRES_PASSWORD: akasha
          POSTGRES_DB: akasha
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U akasha" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://akasha:akasha@localhost:5432/akasha
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1 # reads rust-toolchain.toml
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli@0.8.6
      # sqlx macros check queries against this database, so it needs the schema first.
      - run: sqlx migrate run --source crates/db/migrations
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: .sqlx query cache is up to date
        run: cargo sqlx prepare --workspace --check -- --all-targets
      - name: openapi.json is up to date
        run: |
          cargo run -q -p akasha -- openapi | diff -u openapi.json - \
            || (echo "::error::openapi.json is stale: run 'just openapi'" && exit 1)

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Playwright against the real stack: Postgres + `akasha serve` with the built UI
  # embedded (feature embed-ui), deterministic models and the fake LLM.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: akasha
          POSTGRES_PASSWORD: akasha
          POSTGRES_DB: akasha
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U akasha" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://akasha:akasha@localhost:5432/akasha
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      - run: cargo build -p akasha --features embed-ui
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  docker:
    # Native runners per architecture (no QEMU emulation of the Rust build).
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      MODELS: -v akasha-models:/var/lib/akasha/models -e AKASHA_EMBED_MODEL=all-minilm-l6-v2 -e AKASHA_RERANK_MODEL=none -e AKASHA_WHISPER_MODEL=tiny
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: akasha:ci
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}
      # The image must really run inference: loads ONNX Runtime from the image and
      # small models from Hugging Face (MiniLM ~90 MB, Whisper tiny ~75 MB).
      - name: Smoke test (ONNX Runtime + embedding model + Whisper)
        run: |
          docker run --rm $MODELS akasha:ci models check | tee check.txt
          if [ "${{ matrix.arch }}" = amd64 ]; then grep -q "cpu build avx2" check.txt; fi
      # The no-AVX check under QEMU is slow (30+ min): it runs in portability.yml.
