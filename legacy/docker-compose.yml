services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: akasha-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: akasha
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: akasha-redis
    ports:
      - "6379:6379"

  embedding:
    build:
      context: .
      dockerfile: apps/embedding/Dockerfile
    container_name: akasha-embedding
    ports:
      - "8000:8000"
    volumes:
      - ./apps/embedding:/app
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: akasha-api
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/shared/node_modules
      - /app/packages/db/node_modules
      - ./storage:/storage
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/akasha
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
      - embedding
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: akasha-worker
    command: pnpm --filter @akasha/api dev:worker
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/shared/node_modules
      - /app/packages/db/node_modules
      - ./storage:/storage
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/akasha
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
      - embedding
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: akasha-web
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/shared/node_modules
    depends_on:
      - api
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
