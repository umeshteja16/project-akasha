# Development: `just db-up` starts only Postgres.
# Full stack:  `docker compose --profile app up --build`
#   (chat uses Ollama on the host: run it with OLLAMA_HOST=0.0.0.0, see README).
# With Ollama in a container too:
#   AKASHA_OLLAMA_URL=http://ollama:11434 docker compose --profile app --profile ollama up --build
#   docker compose exec ollama ollama pull llama3.1:8b
# Monitoring (Prometheus on :9091, Grafana on :3000 with the Akasha dashboard):
#   AKASHA_METRICS_ENABLED=true docker compose --profile app --profile monitoring up --build
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: akasha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-akasha}
      POSTGRES_DB: akasha
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akasha"]
      interval: 5s
      timeout: 3s
      retries: 10

  akasha:
    profiles: ["app"]
    build: .
    environment:
      DATABASE_URL: postgres://akasha:${POSTGRES_PASSWORD:-akasha}@postgres:5432/akasha
      AKASHA_LOG_FORMAT: json
      # API and background worker in one process (the image default too).
      AKASHA_SERVE_WITH_WORKER: "true"
      # Set to true once the server is behind HTTPS.
      AKASHA_COOKIE_SECURE: ${AKASHA_COOKIE_SECURE:-false}
      # A reverse proxy in front (README, "Deploying behind a reverse proxy"): its address
      # or network, e.g. 172.16.0.0/12 for a proxy container on this Compose network.
      AKASHA_TRUSTED_PROXIES: ${AKASHA_TRUSTED_PROXIES:-}
      # Chat answers from Ollama on the host by default (see README, "Chat & LLM providers");
      # AKASHA_OLLAMA_URL=http://ollama:11434 with `--profile ollama` uses the container below.
      AKASHA_LLM_PROVIDER: ${AKASHA_LLM_PROVIDER:-ollama}
      AKASHA_OLLAMA_URL: ${AKASHA_OLLAMA_URL:-http://host.docker.internal:11434}
      AKASHA_LLM_MODEL: ${AKASHA_LLM_MODEL:-}
      AKASHA_STRICT_OFFLINE: ${AKASHA_STRICT_OFFLINE:-false}
      AKASHA_ANTHROPIC_API_KEY: ${AKASHA_ANTHROPIC_API_KEY:-}
      AKASHA_GEMINI_API_KEY: ${AKASHA_GEMINI_API_KEY:-}
      # Watched folders (Settings → Sources): mount folders under /watch (see volumes)
      # and allow them here, e.g. AKASHA_WATCH_ROOTS=/watch.
      AKASHA_WATCH_ROOTS: ${AKASHA_WATCH_ROOTS:-}
      # Prometheus metrics on a separate port that is not published on the host; the
      # `monitoring` profile scrapes it over the Compose network.
      AKASHA_METRICS_ENABLED: ${AKASHA_METRICS_ENABLED:-false}
      AKASHA_METRICS_BIND_ADDR: 0.0.0.0:9090
      # Traces to an OpenTelemetry collector (OTLP over HTTP), e.g. http://otel-collector:4318
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    # host.docker.internal resolves to the host on Linux too (Docker Desktop has it built in).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - storage:/var/lib/akasha/storage
      - models:/var/lib/akasha/models
      # A folder to watch, read-only (Akasha never changes it), e.g. an Obsidian vault:
      # - ~/Documents/Vault:/watch/Vault:ro
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Optional local model server: `--profile ollama`. Models persist in the `ollama` volume.
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:0.12.3
    volumes:
      - ollama:/root/.ollama
    # Not published on the host: only akasha talks to it (http://ollama:11434).
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # `--profile monitoring`: Prometheus scrapes akasha:9090, Grafana shows
  # deploy/grafana/akasha.json (admin password: GRAFANA_PASSWORD, default "admin").
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.5.0
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    ports:
      - "127.0.0.1:9091:9090"

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/akasha.json:/var/lib/grafana/dashboards/akasha.json:ro
      - grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]

volumes:
  pgdata:
  storage:
  models:
  ollama:
  prometheus:
  grafana:
