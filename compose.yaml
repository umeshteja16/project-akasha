# Self-hosting guide: docs/self-hosting.md. Settings go in a `.env` next to this file.
# Development: `just db-up` starts only Postgres.
# Published image:  `docker compose --profile app pull && docker compose --profile app up -d`
#   (or put COMPOSE_PROFILES=app in .env and drop `--profile app`).
# Build from source instead:  `docker compose --profile app up -d --build`
# Chat uses Ollama on the host by default: run it with OLLAMA_HOST=0.0.0.0 (docs/self-hosting.md).
# With Ollama in a container too:
#   AKASHA_OLLAMA_URL=http://ollama:11434 docker compose --profile app --profile ollama up -d
#   docker compose exec ollama ollama pull llama3.1:8b
# Monitoring (Prometheus on :9091, Grafana on :3000 with the Akasha dashboard; needs the
# deploy/ folder next to this file):
#   AKASHA_METRICS_ENABLED=true docker compose --profile app --profile monitoring up -d
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: akasha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-akasha}
      POSTGRES_DB: akasha
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akasha"]
      interval: 5s
      timeout: 3s
      retries: 10

  akasha:
    profiles: ["app"]
    # The published multi-arch image; `--build` (or a missing image with this checkout)
    # builds it from source instead. AKASHA_VERSION pins a release, e.g. 0.1.0.
    image: ghcr.io/umeshteja16/project-akasha:${AKASHA_VERSION:-latest}
    build: .
    environment:
      DATABASE_URL: postgres://akasha:${POSTGRES_PASSWORD:-akasha}@postgres:5432/akasha
      AKASHA_LOG_FORMAT: json
      # API and background worker in one process (the image default too).
      AKASHA_SERVE_WITH_WORKER: "true"
      # Anyone who can reach the server may register (all accounts are equal): set to
      # false once the people who need an account have signed up.
      AKASHA_ALLOW_REGISTRATION: ${AKASHA_ALLOW_REGISTRATION:-true}
      AKASHA_MAX_UPLOAD_MB: ${AKASHA_MAX_UPLOAD_MB:-512}
      # Set to true once the server is behind HTTPS.
      AKASHA_COOKIE_SECURE: ${AKASHA_COOKIE_SECURE:-false}
      # A reverse proxy in front (docs/self-hosting.md, "Reverse proxy and HTTPS"): its address
      # or network, e.g. 172.16.0.0/12 for a proxy container on this Compose network.
      AKASHA_TRUSTED_PROXIES: ${AKASHA_TRUSTED_PROXIES:-}
      # Chat answers from Ollama on the host by default (docs/self-hosting.md, "Choosing an LLM for chat");
      # AKASHA_OLLAMA_URL=http://ollama:11434 with `--profile ollama` uses the container below.
      AKASHA_LLM_PROVIDER: ${AKASHA_LLM_PROVIDER:-ollama}
      AKASHA_OLLAMA_URL: ${AKASHA_OLLAMA_URL:-http://host.docker.internal:11434}
      AKASHA_LLM_MODEL: ${AKASHA_LLM_MODEL:-}
      AKASHA_STRICT_OFFLINE: ${AKASHA_STRICT_OFFLINE:-false}
      AKASHA_ANTHROPIC_API_KEY: ${AKASHA_ANTHROPIC_API_KEY:-}
      AKASHA_GEMINI_API_KEY: ${AKASHA_GEMINI_API_KEY:-}
      # Any OpenAI-compatible server (AKASHA_LLM_PROVIDER=openai; AKASHA_LLM_MODEL is required).
      AKASHA_OPENAI_BASE_URL: ${AKASHA_OPENAI_BASE_URL:-https://api.openai.com/v1}
      AKASHA_OPENAI_API_KEY: ${AKASHA_OPENAI_API_KEY:-}
      # Models (docs/self-hosting.md): change AKASHA_EMBED_MODEL only with `akasha reembed`.
      AKASHA_EMBED_MODEL: ${AKASHA_EMBED_MODEL:-multilingual-e5-small}
      AKASHA_RERANK_MODEL: ${AKASHA_RERANK_MODEL:-jina-reranker-v1-turbo-en}
      # Download sources; set to an empty value (AKASHA_ML_MODELS_URL=) to never download.
      AKASHA_ML_MODELS_URL: ${AKASHA_ML_MODELS_URL-https://huggingface.co}
      AKASHA_OCR_MODELS_URL: ${AKASHA_OCR_MODELS_URL-https://ocrs-models.s3-accelerate.amazonaws.com}
      AKASHA_TRANSCRIBE_ENABLED: ${AKASHA_TRANSCRIBE_ENABLED:-true}
      AKASHA_WHISPER_MODEL: ${AKASHA_WHISPER_MODEL:-base}
      # Watched folders (Settings → Sources): mount folders under /watch (see volumes)
      # and allow them here, e.g. AKASHA_WATCH_ROOTS=/watch.
      AKASHA_WATCH_ROOTS: ${AKASHA_WATCH_ROOTS:-}
      # Prometheus metrics on a separate port that is not published on the host; the
      # `monitoring` profile scrapes it over the Compose network.
      AKASHA_METRICS_ENABLED: ${AKASHA_METRICS_ENABLED:-false}
      AKASHA_METRICS_BIND_ADDR: 0.0.0.0:9090
      # Traces to an OpenTelemetry collector (OTLP over HTTP), e.g. http://otel-collector:4318
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    # host.docker.internal resolves to the host on Linux too (Docker Desktop has it built in).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Loopback only. Behind a reverse proxy on another machine, or for LAN access over
      # plain HTTP, set AKASHA_HTTP_BIND=0.0.0.0 in .env.
      - "${AKASHA_HTTP_BIND:-127.0.0.1}:8080:8080"
    volumes:
      - storage:/var/lib/akasha/storage
      - models:/var/lib/akasha/models
      # A folder to watch, read-only (Akasha never changes it), e.g. an Obsidian vault:
      # - ~/Documents/Vault:/watch/Vault:ro
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Optional local model server: `--profile ollama`. Models persist in the `ollama` volume.
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:0.12.3
    volumes:
      - ollama:/root/.ollama
    # Not published on the host: only akasha talks to it (http://ollama:11434).
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # `--profile monitoring`: Prometheus scrapes akasha:9090, Grafana shows
  # deploy/grafana/akasha.json (admin password: GRAFANA_PASSWORD, default "admin").
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.5.0
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    ports:
      - "127.0.0.1:9091:9090"

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/akasha.json:/var/lib/grafana/dashboards/akasha.json:ro
      - grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]

volumes:
  pgdata:
  storage:
  models:
  ollama:
  prometheus:
  grafana:
