[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/umeshteja16/project-akasha"
publish = false

[workspace.dependencies]
akasha-core = { path = "crates/core" }
akasha-db = { path = "crates/db" }
akasha-storage = { path = "crates/storage" }
akasha-jobs = { path = "crates/jobs" }
akasha-ingest = { path = "crates/ingest" }
akasha-ml = { path = "crates/ml", default-features = false }

anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
tower_governor = { version = "0.7", default-features = false, features = ["axum"] }
uuid = { version = "1", features = ["v4", "serde"] }
axum = { version = "0.8", features = ["multipart"] }
clap = { version = "4", features = ["derive", "env"] }
governor = "0.8"
figment = { version = "0.10", features = ["env", "toml"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "chrono", "json"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "timeout", "catch-panic", "propagate-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
hex = "0.4"
infer = { version = "0.19", default-features = false }
object_store = { version = "0.14", features = ["aws"] }
tempfile = "3"
# Extraction (crates/ingest, ADR 0008). lopdf must match the version pdf-extract uses.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff"] }
lopdf = { version = "0.42", default-features = false }
ocrs = { version = "0.13", default-features = false, features = ["rten"] }
pdf-extract = "0.12"
pulldown-cmark = { version = "0.13", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking"] }
rten = { version = "0.26", default-features = false, features = ["rten_format"] }
text-splitter = "0.33"
unicode-normalization = "0.1"
# Embeddings and reranking (crates/ml, ADR 0009). ONNX Runtime is loaded at run time
# (ort load-dynamic), so builds never download native binaries.
fastembed = { version = "7.1", default-features = false, features = ["ort-load-dynamic"] }
# Must be the exact version fastembed uses (runtime loading needs the shared global).
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "std", "api-24"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.dev]
# Dependencies are rebuilt rarely; optimise them so ML/OCR code is usable in dev.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
