[package]
name = "akasha"
description = "The Akasha server binary: HTTP API, background worker and admin commands."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "akasha"
path = "src/main.rs"

[features]
default = ["onnx", "whisper"]
# Real embedding/rerank models through ONNX Runtime (loaded at run time).
onnx = ["akasha-ml/onnx"]
# Real speech-to-text with whisper.cpp (compiled from source: needs cmake and a C++
# compiler). Without it, only the test transcriber (`AKASHA_WHISPER_MODEL=fake`) works.
whisper = ["akasha-media/whisper"]
# Embed the built web UI from web/dist (run `pnpm build` in web/ first). Without it
# the server is API-only and the UI is served by Vite in development.
embed-ui = ["dep:rust-embed"]

[dependencies]
akasha-core.workspace = true
akasha-db.workspace = true
akasha-ingest.workspace = true
akasha-jobs.workspace = true
akasha-llm.workspace = true
akasha-media.workspace = true
akasha-ml.workspace = true
akasha-search.workspace = true
akasha-storage.workspace = true
anyhow.workspace = true
argon2.workspace = true
axum.workspace = true
axum-extra.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
clap.workspace = true
futures-util.workspace = true
governor.workspace = true
infer.workspace = true
ipnet.workspace = true
mime_guess.workspace = true
reqwest.workspace = true
rmcp.workspace = true
schemars.workspace = true
rust-embed = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tempfile.workspace = true
time.workspace = true
tokio.workspace = true
tower-http.workspace = true
tower_governor.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
uuid.workspace = true

[dev-dependencies]
http-body-util.workspace = true
image.workspace = true
tower.workspace = true

[lints]
workspace = true
