[package]
name = "akasha-ml"
description = "Embeddings and reranking for Akasha, in-process via ONNX Runtime (fastembed)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["onnx"]
# Real models through ONNX Runtime. Without it only the hash/overlap test models exist.
onnx = ["dep:fastembed", "dep:ort"]

[dependencies]
fastembed = { workspace = true, optional = true }
hex.workspace = true
ort = { workspace = true, optional = true }
reqwest.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
