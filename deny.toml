# cargo-deny: blocks known-vulnerable, yanked or unexpected-source dependencies.
[advisories]
yanked = "deny"
ignore = [
  # ttf-parser is unmaintained (not a vulnerability). It comes in through lopdf, the
  # PDF parser under pdf-extract (ADR 0008), with no maintained alternative there yet.
  # Revisit when lopdf moves to skrifa.
  { id = "RUSTSEC-2026-0192", reason = "unmaintained only; required by lopdf (ADR 0008)" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Workspace crates reference each other by path; they are never published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
# Our own crates are `publish = false` and have no license yet (see PROGRESS.md).
private = { ignore = true }
# Permissive licenses only. Add to this list deliberately (and note it in an ADR).
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0", "MPL-2.0", "0BSD", "BSL-1.0",
]
